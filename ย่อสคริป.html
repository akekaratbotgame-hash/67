<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ย่อโค้ด - สำหรับโค้ดของตัวเอง</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
        body{background:#0f172a;color:#fff;min-height:100vh;padding:20px}
        .container{max-width:700px;margin:0 auto}
        h1{text-align:center;margin-bottom:20px;color:#38bdf8}
        textarea{width:100%;height:180px;background:#1e293b;border:2px solid #334155;border-radius:12px;padding:15px;color:#fff;font-size:14px;resize:vertical;margin-bottom:15px}
        button{width:100%;padding:14px;background:#38bdf8;color:#000;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:15px}
        button:hover{background:#7dd3fc}
        .note{margin-top:15px;color:#94a3b8;font-size:13px;line-height:1.6}
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 ย่อโค้ด (สำหรับโค้ดของคุณเอง)</h1>
        
        <textarea id="input" placeholder="วางโค้ดที่นี่..."></textarea>
        
        <button onclick="minifyCode()">✨ ย่อโค้ด</button>
        
        <textarea id="output" placeholder="ผลลัพธ์จะแสดงที่นี่..." readonly></textarea>
        
        <button onclick="copyOutput()">📋 คัดลอก</button>
        
        <p class="note">
            ⚠️ เครื่องมือนี้สำหรับจัดการโค้ดที่คุณเขียนเองเท่านั้น<br>
            การใช้สคริปต์ภายนอกกับเกมอาจละเมิดกฎและถูกระงับบัญชีได้
        </p>
    </div>

<script>
function minifyCode(){
    let code = document.getElementById('input').value;
    if(!code) return alert('กรุณาใส่โค้ดก่อน');
    
    // ย่อช่องว่างและขึ้นบรรทัดใหม่
    let minified = code
        .replace(/\s+/g, ' ')
        .replace(/\s*([{}();,=+\-*/<>])\s*/g, '$1')
        .trim();
    
    document.getElementById('output').value = minified;
}

function copyOutput(){
    let out = document.getElementById('output');
    if(!out.value) return;
    out.select();
    document.execCommand('copy');
    alert('คัดลอกแล้ว! ✅');
}
</script>
</body>
</html>
